name: Build FlatPastel98.jar

on:
  workflow_dispatch:
  push:
    branches: [Pastel98]
    paths:
      - 'src/**'
      - '.github/workflows/build-pastel98.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Download flatlaf.jar (compile-time dependency)
        run: |
          curl -sSL -o flatlaf.jar \
            https://repo1.maven.org/maven2/com/formdev/flatlaf/3.7.2/flatlaf-3.7.2.jar

      - name: Compile
        run: |
          mkdir -p bin
          javac -cp flatlaf.jar -d bin $(find src -name '*.java')
          cp src/com/github/deviceargent/pastel98/*.properties \
            bin/com/github/deviceargent/pastel98/

      - name: Package FlatPastel98.jar
        run: jar cvf FlatPastel98.jar -C bin .

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatPastel98
          path: FlatPastel98.jar

      - name: Commit built jar back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FlatPastel98.jar
          git diff --staged --quiet && echo "No changes" || (git commit -m "ci: rebuild FlatPastel98.jar" && git push)
