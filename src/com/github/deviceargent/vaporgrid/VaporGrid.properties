#
# VaporGrid - Retrowave / synthwave theme for JDownloader 2
# Standalone FlatLaf theme based on FlatLaf Dark
# Deep night purple + cyan neon + magenta hot pink + sunset gold
#

#---- variables ----

@background = #150830
@foreground = #e8ddff
@brightBackground = #190b38
@disabledBackground = #1d0d42
@disabledForeground = #7565a0

@buttonBackground = #1d0d42
@componentBackground = #190b38
@menuBackground = #170938

@selectionBackground = #ff3c98
@selectionForeground = #ffffff
@selectionInactiveBackground = #451a68
@selectionInactiveForeground = #ccc0e8

@menuSelectionBackground = #ff3c98
@menuHoverBackground = lighten(@menuBackground,6%,derived)
@menuCheckBackground = darken(@menuSelectionBackground,10%,derived noAutoInverse)
@menuAcceleratorForeground = #7b6a9e
@menuAcceleratorSelectionForeground = #ffffff

@cellFocusColor = @accentColor
@icon = tint(@foreground,7%)

@accentColor = #00fff9
@cyanNeon = #00fff9
@magentaHot = #ff2a6d
@sunsetGold = #f9c80e
@sunsetOrange = #f86624

@buttonArrowColor = #00fff9
@buttonDisabledArrowColor = #4a3a6a
@buttonHoverArrowColor = lighten(@buttonArrowColor,10%,derived noAutoInverse)
@buttonPressedArrowColor = darken(@buttonArrowColor,10%,derived noAutoInverse)

@dropCellBackground = darken(List.selectionBackground,15%,lazy)
@dropCellForeground = lazy(List.selectionForeground)
@dropLineColor = darken(List.selectionBackground,20%,lazy)
@dropLineShortColor = darken(List.selectionBackground,35%,lazy)


#---- system colors ----

activeCaption = @componentBackground
inactiveCaption = @background
controlHighlight = lighten($controlShadow,15%)
controlLtHighlight = lighten($controlShadow,20%)
controlDkShadow = darken($controlShadow,12%)


#---- Button ----

Button.background = @buttonBackground
Button.hoverBackground = lighten($Button.background,6%,derived)
Button.pressedBackground = darken($Button.background,5%,derived)
Button.selectedBackground = #4a1d70
Button.selectedForeground = #ff2a6d
Button.disabledSelectedBackground = lighten($Button.background,2%,derived)

Button.borderColor = #3a1660
Button.disabledBorderColor = #2a0c4a
Button.focusedBorderColor = #00fff9
Button.hoverBorderColor = #ff2a6d

Button.innerFocusWidth = 1
Button.focusWidth = 2

Button.default.background = #3a1660
Button.default.foreground = #00fff9
Button.default.hoverBackground = #4a1d70
Button.default.pressedBackground = #2a0c4a
Button.default.borderColor = #00fff9
Button.default.hoverBorderColor = #ff2a6d
Button.default.focusedBorderColor = #00fff9
Button.default.focusColor = #00fff9
Button.default.boldText = true

Button.toolbar.hoverBackground = lighten($Button.background,4%,derived)
Button.toolbar.pressedBackground = darken($Button.background,4%,derived)
Button.toolbar.selectedBackground = #4a1d70


#---- CheckBox ----

CheckBox.icon.focusWidth = 1
CheckBox.icon.borderColor = #3a1660
CheckBox.icon.background = #190b38
CheckBox.icon.selectedBorderColor = #00fff9
CheckBox.icon.selectedBackground = #3a1660
CheckBox.icon.checkmarkColor = #00fff9
CheckBox.icon.disabledBorderColor = #2a0c4a
CheckBox.icon.disabledBackground = @disabledBackground
CheckBox.icon.disabledCheckmarkColor = #4a3a6a
CheckBox.icon.focusedBorderColor = #00fff9
CheckBox.icon.focusedBackground = fade(#00fff9,12%)
CheckBox.icon.hoverBorderColor = #ff2a6d
CheckBox.icon.hoverBackground = lighten($CheckBox.icon.background,4%,derived)
CheckBox.icon.pressedBorderColor = #ff2a6d
CheckBox.icon.pressedBackground = lighten($CheckBox.icon.background,6%,derived)
CheckBox.icon[filled].selectedBorderColor = #00fff9
CheckBox.icon[filled].selectedBackground = #00fff9
CheckBox.icon[filled].checkmarkColor = #150830
CheckBox.icon[filled].hoverSelectedBackground = lighten($CheckBox.icon[filled].selectedBackground,4%,derived)
CheckBox.icon[filled].pressedSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,6%,derived)


#---- CheckBoxMenuItem ----

CheckBoxMenuItem.icon.checkmarkColor = @buttonArrowColor
CheckBoxMenuItem.icon.disabledCheckmarkColor = @buttonDisabledArrowColor


#---- Component ----

Component.borderColor = #3a1660
Component.disabledBorderColor = #2a0c4a
Component.focusedBorderColor = #00fff9
Component.focusColor = #00fff9
Component.linkColor = #ff2a6d
Component.accentColor = #00fff9
Component.grayFilter = -20,-70,100

Component.error.borderColor = desaturate($Component.error.focusedBorderColor,25%)
Component.error.focusedBorderColor = #ff2a6d
Component.warning.borderColor = darken(desaturate($Component.warning.focusedBorderColor,20%),10%)
Component.warning.focusedBorderColor = #f9c80e
Component.custom.borderColor = desaturate(#f00,50%,relative derived noAutoInverse)


#---- Desktop ----

Desktop.background = @brightBackground


#---- DesktopIcon ----

DesktopIcon.background = lighten($Desktop.background,12%,derived)


#---- HelpButton ----

HelpButton.questionMarkColor = shade(@foreground,10%)
HelpButton.disabledQuestionMarkColor = tint(@background,30%)


#---- InternalFrame ----

InternalFrame.activeTitleBackground = #200a45
InternalFrame.activeTitleForeground = #00fff9
InternalFrame.inactiveTitleBackground = #160940
InternalFrame.inactiveTitleForeground = #6b5a8a
InternalFrame.activeBorderColor = #3a1660
InternalFrame.inactiveBorderColor = #2a0c4a
InternalFrame.buttonHoverBackground = lighten($InternalFrame.activeTitleBackground,8%,derived)
InternalFrame.buttonPressedBackground = lighten($InternalFrame.activeTitleBackground,14%,derived)
InternalFrame.closeHoverBackground = #ff2a6d
InternalFrame.closePressedBackground = darken(#ff2a6d,10%,derived)
InternalFrame.closeHoverForeground = #fff
InternalFrame.closePressedForeground = #fff
InternalFrame.activeDropShadowOpacity = 0.5
InternalFrame.inactiveDropShadowOpacity = 0.75


#---- Menu ----

Menu.foreground = @cyanNeon
Menu.selectionBackground = @magentaHot
Menu.selectionForeground = #ffffff
MenuItem.foreground = @cyanNeon
MenuItem.selectionBackground = @magentaHot
MenuItem.selectionForeground = #ffffff
Menu.icon.arrowColor = @buttonArrowColor
Menu.icon.disabledArrowColor = @buttonDisabledArrowColor


#---- MenuBar ----

MenuBar.foreground = @cyanNeon
MenuBar.hoverBackground = @magentaHot
MenuBar.borderColor = $Separator.foreground


#---- PasswordField ----

PasswordField.capsLockIconColor = #f9c80e80
PasswordField.revealIconColor = @foreground


#---- Popup ----

Popup.dropShadowColor = #000
Popup.dropShadowOpacity = 0.45


#---- PopupMenu ----

PopupMenu.borderColor = #3a1660
PopupMenu.hoverScrollArrowBackground = lighten(@background,6%)


#---- ProgressBar ----

ProgressBar.background = #200a45
ProgressBar.foreground = #00fff9
ProgressBar.selectionBackground = #150830
ProgressBar.selectionForeground = #00fff9


#---- RootPane ----

RootPane.activeBorderColor = #3a1660
RootPane.inactiveBorderColor = #2a0c4a


#---- ScrollBar ----

ScrollBar.track = #150830
ScrollBar.thumb = #3a1660
ScrollBar.hoverTrackColor = #190b38
ScrollBar.hoverThumbColor = #00fff9
ScrollBar.pressedThumbColor = #ff2a6d
ScrollBar.hoverButtonBackground = lighten(@background,6%,derived noAutoInverse)
ScrollBar.pressedButtonBackground = lighten(@background,10%,derived noAutoInverse)


#---- Separator ----

Separator.foreground = #3a1660


#---- Slider ----

Slider.trackValueColor = #00fff9
Slider.trackColor = #2a0c4a
Slider.thumbColor = #ff2a6d
Slider.tickColor = @disabledForeground
Slider.focusedColor = fade(changeLightness(#00fff9,60%,derived),30%,derived)
Slider.hoverThumbColor = lighten($Slider.thumbColor,5%,derived)
Slider.pressedThumbColor = lighten($Slider.thumbColor,8%,derived)
Slider.disabledTrackColor = lighten(@background,6%)
Slider.disabledThumbColor = $Slider.disabledTrackColor


#---- SplitPane ----

SplitPaneDivider.draggingColor = #00fff9


#---- TabbedPane ----

TabbedPane.underlineColor = #ff3c98
TabbedPane.inactiveUnderlineColor = #ff3c98
TabbedPane.disabledUnderlineColor = #3a1660
TabbedPane.hoverColor = lighten($TabbedPane.background,5%,derived noAutoInverse)
TabbedPane.focusColor = fade(#00fff9,30%)
TabbedPane.contentAreaColor = #3a1660
TabbedPane.buttonHoverBackground = lighten($TabbedPane.background,6%,derived noAutoInverse)
TabbedPane.buttonPressedBackground = lighten($TabbedPane.background,10%,derived noAutoInverse)
TabbedPane.closeBackground = null
TabbedPane.closeForeground = @disabledForeground
TabbedPane.closeHoverBackground = #ff2a6d
TabbedPane.closeHoverForeground = #ffffff
TabbedPane.closePressedBackground = darken(#ff2a6d,12%,derived)
TabbedPane.closePressedForeground = #ffffff


#---- Table ----

Table.gridColor = #2a0c4a


#---- TableHeader ----

TableHeader.hoverBackground = lighten($TableHeader.background,6%,derived)
TableHeader.pressedBackground = lighten($TableHeader.background,10%,derived)
TableHeader.separatorColor = #3a1660
TableHeader.bottomSeparatorColor = $TableHeader.separatorColor


#---- TitlePane ----

TitlePane.background = #150830
TitlePane.inactiveBackground = #160940
TitlePane.foreground = @foreground
TitlePane.inactiveForeground = @disabledForeground
TitlePane.embeddedForeground = @foreground
TitlePane.buttonBackground = #190b38
TitlePane.buttonHoverBackground = #ff3c98
TitlePane.buttonPressedBackground = darken($TitlePane.buttonHoverBackground,15%,derived)
TitlePane.closeHoverBackground = #ff2a6d
TitlePane.closePressedBackground = darken($TitlePane.closeHoverBackground,12%,derived)
TitlePane.closeHoverForeground = #ffffff
TitlePane.closePressedForeground = #ffffff


#---- ToggleButton ----

ToggleButton.selectedBackground = #4a1d70
ToggleButton.selectedForeground = #ff2a6d
ToggleButton.disabledSelectedBackground = lighten($ToggleButton.background,3%,derived)
ToggleButton.toolbar.selectedBackground = #4a1d70


#---- ToolBar ----

ToolBar.hoverButtonGroupBackground = lighten($ToolBar.background,5%,derived)


#---- ToolTip ----

ToolTip.border = 4,6,4,6
ToolTip.background = #200a45


#---- Tree ----

Tree.hash = #3a1660


#---- custom UIs (retrowave grid) ----

PanelUI = com.github.deviceargent.vaporgrid.VaporGridPanelUI
DesktopPaneUI = com.github.deviceargent.vaporgrid.VaporGridDesktopPaneUI


#---- Styles ------------------------------------------------------------------

[style]Button.inTextField = \
	focusable: false; \
	toolbar.margin: 1,1,1,1; \
	toolbar.spacingInsets: 1,1,1,1; \
	toolbar.hoverBackground: lighten($TextField.background,6%); \
	toolbar.pressedBackground: lighten($TextField.background,10%); \
	toolbar.selectedBackground: lighten($TextField.background,14%)
