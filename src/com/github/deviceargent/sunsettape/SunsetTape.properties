#
# SunsetTape - VHS sunset theme for JDownloader 2
# Standalone FlatLaf theme based on FlatLaf Light
# Warm paper cream + sunset tape gradient palette:
# purple #4E286C / magenta #C92F61 / orange #E56934 / gold #F4B32A
#

#---- variables ----

@background = #f3efe3
@foreground = #4e286c
@brightBackground = #faf7ee
@disabledBackground = #e8e2d2
@disabledForeground = #b0a893

@buttonBackground = #efe9da
@componentBackground = #f8f4e9
@menuBackground = #f5f1e4

@selectionBackground = #c92f61
@selectionForeground = #faf7ee
@selectionInactiveBackground = #e5bdd0
@selectionInactiveForeground = #5d3a70

@menuSelectionBackground = #c92f61
@menuHoverBackground = darken(@menuBackground,4%,derived)
@menuCheckBackground = darken(@menuSelectionBackground,6%,derived noAutoInverse)
@menuAcceleratorForeground = #a08b6e
@menuAcceleratorSelectionForeground = #faf7ee

@cellFocusColor = @accentColor
@icon = shade(@foreground,7%)

@accentColor = #c92f61
@accentBaseColor = @accentColor
@accentBase2Color = #e56934
@accentFocusColor = if(@accentColor, @accentColor, spin(@accentBaseColor,-8))
@accentLinkColor = if(@accentColor, @accentColor, saturate(spin(@accentBaseColor,-5),50%))
@accentSelectionBackground = if(@accentColor, @accentColor, @accentBaseColor)
@accentSliderColor = if(@accentColor, @accentColor, @accentBase2Color)
@accentUnderlineColor = if(@accentColor, @accentColor, @accentBase2Color)
@accentButtonDefaultBackground = if(@accentColor, @accentColor, spin(@accentBaseColor,-8))

@purpleInk = #4e286c
@magentaTape = #c92f61
@orangeSunset = #e56934
@goldSun = #f4b32a

@buttonArrowColor = shade(@foreground,17%)
@buttonDisabledArrowColor = tint(@buttonArrowColor,25%)
@buttonHoverArrowColor = @orangeSunset
@buttonPressedArrowColor = darken(@orangeSunset,10%,derived noAutoInverse)

@dropCellBackground = darken(List.selectionBackground,6%,lazy)
@dropCellForeground = lazy(List.selectionForeground)
@dropLineColor = darken(List.selectionBackground,10%,lazy)
@dropLineShortColor = darken(List.selectionBackground,25%,lazy)


#---- system colors ----

activeCaption = @brightBackground
inactiveCaption = @background
controlHighlight = lighten($controlShadow,20%)
controlLtHighlight = lighten($controlShadow,25%)
controlDkShadow = darken($controlShadow,10%)


#---- Button ----

Button.background = @buttonBackground
Button.hoverBackground = fade(@orangeSunset,18%)
Button.pressedBackground = fade(@magentaTape,22%)
Button.selectedBackground = #e5bdd0
Button.selectedForeground = #5d3a70
Button.disabledSelectedBackground = darken($Button.background,3%,derived)

Button.borderColor = #d8cfb8
Button.disabledBorderColor = $Button.borderColor
Button.focusedBorderColor = @magentaTape
Button.hoverBorderColor = @orangeSunset

Button.innerFocusWidth = 1

Button.default.background = fade(@magentaTape,85%)
Button.default.foreground = #faf7ee
Button.default.hoverBackground = @magentaTape
Button.default.pressedBackground = darken(@magentaTape,8%,derived)
Button.default.borderColor = #a82250
Button.default.hoverBorderColor = @orangeSunset
Button.default.focusedBorderColor = @magentaTape
Button.default.focusColor = @magentaTape
Button.default.boldText = true

Button.toolbar.hoverBackground = fade(@orangeSunset,14%)
Button.toolbar.pressedBackground = fade(@magentaTape,18%)
Button.toolbar.selectedBackground = #e5bdd0


#---- CheckBox ----

CheckBox.icon.focusWidth = 1
CheckBox.icon.borderColor = #cfc2a8
CheckBox.icon.background = @componentBackground
CheckBox.icon.selectedBorderColor = #a82250
CheckBox.icon.selectedBackground = fade(@magentaTape,25%)
CheckBox.icon.checkmarkColor = #a82250
CheckBox.icon.disabledBorderColor = #d8cfb8
CheckBox.icon.disabledBackground = @disabledBackground
CheckBox.icon.disabledCheckmarkColor = #b0a893
CheckBox.icon.focusedBorderColor = @magentaTape
CheckBox.icon.focusedBackground = fade(@magentaTape,15%)
CheckBox.icon.hoverBorderColor = @orangeSunset
CheckBox.icon.hoverBackground = darken($CheckBox.icon.background,2%,derived)
CheckBox.icon.pressedBorderColor = @magentaTape
CheckBox.icon.pressedBackground = darken($CheckBox.icon.background,4%,derived)
CheckBox.icon[filled].selectedBorderColor = @magentaTape
CheckBox.icon[filled].selectedBackground = @magentaTape
CheckBox.icon[filled].checkmarkColor = #faf7ee
CheckBox.icon[filled].hoverSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,3%,derived)
CheckBox.icon[filled].pressedSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,6%,derived)


#---- CheckBoxMenuItem ----

CheckBoxMenuItem.icon.checkmarkColor = @buttonArrowColor
CheckBoxMenuItem.icon.disabledCheckmarkColor = @buttonDisabledArrowColor


#---- Component ----

Component.borderColor = #d8cfb8
Component.disabledBorderColor = #e2dac6
Component.focusedBorderColor = @magentaTape
Component.focusColor = @magentaTape
Component.linkColor = #a82250
Component.accentColor = @magentaTape
Component.grayFilter = -12,-30,100

Component.error.borderColor = desaturate($Component.error.focusedBorderColor,25%)
Component.error.focusedBorderColor = #c92f61
Component.warning.borderColor = darken(desaturate($Component.warning.focusedBorderColor,20%),10%)
Component.warning.focusedBorderColor = #e56934
Component.custom.borderColor = desaturate(#f00,50%,relative derived noAutoInverse)


#---- Desktop ----

Desktop.background = @brightBackground


#---- DesktopIcon ----

DesktopIcon.background = darken($Desktop.background,4%,derived)


#---- HelpButton ----

HelpButton.questionMarkColor = shade(@foreground,10%)
HelpButton.disabledQuestionMarkColor = tint(@background,30%)


#---- InternalFrame ----

InternalFrame.activeTitleBackground = #efe9da
InternalFrame.activeTitleForeground = #4e286c
InternalFrame.inactiveTitleBackground = #e8e2d2
InternalFrame.inactiveTitleForeground = #b0a893
InternalFrame.activeBorderColor = #d8cfb8
InternalFrame.inactiveBorderColor = #e2dac6
InternalFrame.buttonHoverBackground = darken($InternalFrame.activeTitleBackground,6%,derived)
InternalFrame.buttonPressedBackground = darken($InternalFrame.activeTitleBackground,12%,derived)
InternalFrame.closeHoverBackground = @magentaTape
InternalFrame.closePressedBackground = darken(@magentaTape,10%,derived)
InternalFrame.closeHoverForeground = #faf7ee
InternalFrame.closePressedForeground = #faf7ee
InternalFrame.activeDropShadowOpacity = 0.30
InternalFrame.inactiveDropShadowOpacity = 0.45


#---- Menu ----

Menu.foreground = @foreground
Menu.selectionBackground = @magentaTape
Menu.selectionForeground = #faf7ee
MenuItem.foreground = @foreground
MenuItem.selectionBackground = @magentaTape
MenuItem.selectionForeground = #faf7ee
Menu.icon.arrowColor = @buttonArrowColor
Menu.icon.disabledArrowColor = @buttonDisabledArrowColor


#---- MenuBar ----

MenuBar.foreground = @foreground
MenuBar.hoverBackground = fade(@orangeSunset,20%)
MenuBar.borderColor = $Separator.foreground


#---- PasswordField ----

PasswordField.capsLockIconColor = #f4b32a
PasswordField.revealIconColor = @foreground


#---- Popup ----

Popup.dropShadowColor = #6e5544
Popup.dropShadowOpacity = 0.14


#---- PopupMenu ----

PopupMenu.borderColor = #d8cfb8
PopupMenu.hoverScrollArrowBackground = darken(@background,4%)


#---- ProgressBar ----

ProgressBar.background = #e8e2d2
ProgressBar.foreground = #e56934
ProgressBar.selectionBackground = #faf7ee
ProgressBar.selectionForeground = #4e286c


#---- RootPane ----

RootPane.activeBorderColor = darken(@background,14%,derived)
RootPane.inactiveBorderColor = darken(@background,9%,derived)


#---- ScrollBar ----

ScrollBar.track = #ece5d4
ScrollBar.thumb = #d3c9ae
ScrollBar.hoverTrackColor = #e5ddc8
ScrollBar.hoverThumbColor = fade(@orangeSunset,55%)
ScrollBar.pressedThumbColor = @magentaTape
ScrollBar.hoverButtonBackground = darken(@background,4%,derived noAutoInverse)
ScrollBar.pressedButtonBackground = darken(@background,8%,derived noAutoInverse)


#---- Separator ----

Separator.foreground = #d8cfb8


#---- Slider ----

Slider.trackValueColor = @magentaTape
Slider.trackColor = #e0d7c0
Slider.thumbColor = @orangeSunset
Slider.tickColor = @disabledForeground
Slider.focusedColor = fade(changeLightness(#c92f61,60%,derived),40%,derived)
Slider.hoverThumbColor = darken($Slider.thumbColor,5%,derived)
Slider.pressedThumbColor = darken($Slider.thumbColor,8%,derived)
Slider.disabledTrackColor = darken(@background,6%)
Slider.disabledThumbColor = $Slider.disabledTrackColor


#---- SplitPane ----

SplitPaneDivider.draggingColor = @magentaTape


#---- TabbedPane ----

TabbedPane.underlineColor = #c92f61
TabbedPane.inactiveUnderlineColor = #e56934
TabbedPane.disabledUnderlineColor = #d8cfb8
TabbedPane.hoverColor = fade(@orangeSunset,12%)
TabbedPane.focusColor = fade(@magentaTape,18%)
TabbedPane.contentAreaColor = #d8cfb8
TabbedPane.buttonHoverBackground = darken($TabbedPane.background,4%,derived noAutoInverse)
TabbedPane.buttonPressedBackground = darken($TabbedPane.background,7%,derived noAutoInverse)
TabbedPane.closeBackground = null
TabbedPane.closeForeground = @disabledForeground
TabbedPane.closeHoverBackground = @magentaTape
TabbedPane.closeHoverForeground = #faf7ee
TabbedPane.closePressedBackground = darken(@magentaTape,12%,derived)
TabbedPane.closePressedForeground = #faf7ee


#---- Table ----

Table.gridColor = #e5ddc6


#---- TableHeader ----

TableHeader.hoverBackground = darken($TableHeader.background,4%,derived)
TableHeader.pressedBackground = darken($TableHeader.background,8%,derived)
TableHeader.separatorColor = #d8cfb8
TableHeader.bottomSeparatorColor = $TableHeader.separatorColor


#---- TitlePane ----

TitlePane.background = #efe9da
TitlePane.inactiveBackground = #e8e2d2
TitlePane.foreground = @foreground
TitlePane.inactiveForeground = @disabledForeground
TitlePane.embeddedForeground = @foreground
TitlePane.buttonBackground = @buttonBackground
TitlePane.buttonHoverBackground = fade(@orangeSunset,20%)
TitlePane.buttonPressedBackground = fade(@magentaTape,25%)
TitlePane.closeHoverBackground = @magentaTape
TitlePane.closePressedBackground = darken(@magentaTape,12%,derived)
TitlePane.closeHoverForeground = #faf7ee
TitlePane.closePressedForeground = #faf7ee


#---- ToggleButton ----

ToggleButton.selectedBackground = #e5bdd0
ToggleButton.selectedForeground = #5d3a70
ToggleButton.disabledSelectedBackground = darken($ToggleButton.background,2%,derived)
ToggleButton.toolbar.selectedBackground = #e5bdd0


#---- ToolBar ----

ToolBar.hoverButtonGroupBackground = darken($ToolBar.background,3%,derived)


#---- ToolTip ----

ToolTip.border = 4,6,4,6
ToolTip.background = @brightBackground


#---- Tree ----

Tree.hash = #d8cfb8


#---- custom UIs (sunset tape band on titlebar) ----

RootPaneUI = com.github.deviceargent.sunsettape.SunsetTapeRootPaneUI


#---- Styles ------------------------------------------------------------------

[style]Button.inTextField = \
	focusable: false; \
	toolbar.margin: 1,1,1,1; \
	toolbar.spacingInsets: 1,1,1,1; \
	toolbar.hoverBackground: darken($TextField.background,4%); \
	toolbar.pressedBackground: darken($TextField.background,7%); \
	toolbar.selectedBackground: darken($TextField.background,10%)