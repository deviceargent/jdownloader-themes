Slider.thumbColor = @royale
Slider.hoverThumbColor = @royaleDark

TabbedPane.underlineColor = @royale
TabbedPane.inactiveUnderlineColor = #9fc8ed
TabbedPane.hoverColor = #dceeff
TabbedPane.contentAreaColor = @border

TitlePane.background = @royale
TitlePane.foreground = #ffffff
TitlePane.inactiveBackground = @royaleDark
TitlePane.inactiveForeground = #d9ebff
TitlePane.buttonBackground = @royale
