# XP Royale Blue - initial light theme

@background = #eef5fc
@foreground = #173b63
@surface = #f7fafe
@surfaceAlt = #e2edf8
@royale = #2c78c7
@royaleDark = #185a9d
@selection = #77b7f0
@selectionInactive = #b9d9f4
@green = #4faf58
@border = #9bb9d4
@disabled = #7893aa

@accentColor = @royale
@accentBaseColor = @royale
@accentBase2Color = @green
@accentFocusColor = @royale
@accentLinkColor = @royaleDark
@accentSelectionBackground = @selection
@accentSliderColor = @royale
@accentUnderlineColor = @royale

@background = #eef5fc
@foreground = #173b63
@brightBackground = #ffffff
@disabledBackground = #dbe7f2
@disabledForeground = @disabled

activeCaption = @royale
inactiveCaption = @surfaceAlt
controlHighlight = #ffffff
controlLtHighlight = #ffffff
controlDkShadow = #789ab8

Button.background = @surface
Button.foreground = @foreground
Button.borderColor = @border
Button.hoverBackground = #e8f3ff
Button.pressedBackground = #c9e2f8
Button.focusedBorderColor = @royale
Button.hoverBorderColor = @royale
Button.innerFocusWidth = 1
Button.default.background = @royale
Button.default.foreground = #ffffff
Button.default.hoverBackground = lighten(@royale,8%)
Button.default.pressedBackground = @royaleDark
Button.default.borderColor = @royaleDark
Button.default.boldText = true

Component.borderColor = @border
Component.focusedBorderColor = @royale
Component.focusColor = @royale
Component.accentColor = @royale
Component.linkColor = @royaleDark

Desktop.background = @background

List.background = @brightBackground
List.foreground = @foreground
List.selectionBackground = @selection
List.selectionForeground = @foreground
List.selectionInactiveBackground = @selectionInactive
List.selectionInactiveForeground = @foreground

Menu.foreground = @foreground
Menu.selectionBackground = @royale
Menu.selectionForeground = #ffffff
MenuItem.foreground = @foreground
MenuItem.selectionBackground = @royale
MenuItem.selectionForeground = #ffffff
MenuBar.foreground = @foreground
MenuBar.hoverBackground = #dceeff

Panel.background = @background
ScrollPane.background = @background
Table.background = @brightBackground
Table.foreground = @foreground
Table.selectionBackground = @selection
Table.selectionForeground = @foreground
Table.gridColor = #c8d9e8
TableHeader.background = @surfaceAlt
TableHeader.foreground = @foreground
TableHeader.separatorColor = @border

ProgressBar.background = #d2e1ef
ProgressBar.foreground = @royale
ProgressBar.selectionBackground = #ffffff
ProgressBar.selectionForeground = @royaleDark

RootPane.activeBorderColor = @royale
RootPane.inactiveBorderColor = @border

ScrollBar.track = #dce9f5
ScrollBar.thumb = #9dbbd5
ScrollBar.hoverThumbColor = @royale
ScrollBar.pressedThumbColor = @royaleDark

Separator.foreground = @border
Slider.trackValueColor = @royale
