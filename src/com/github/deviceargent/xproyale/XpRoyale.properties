TitlePane.closeHoverBackground = #d9534f
TitlePane.closePressedBackground = #b52f2b
TitlePane.closeHoverForeground = #ffffff
TitlePane.closePressedForeground = #ffffff

ToolTip.background = #fffef0
ToolTip.foreground = @foreground
ToolTip.border = 1,1,1,1
