#
# Pastel98 - Light Pastel Cream theme for JDownloader 2
# Standalone FlatLaf theme based on FlatLaf Light
# NEC PC-98 pastel mood: warm cream surfaces, dusty rose accent,
# soft lavender / mint / peach secondaries
#

#---- variables ----

@background = #f7f0e3
@foreground = #5c4a63
@brightBackground = #fffaef
@disabledBackground = #efe7d6
@disabledForeground = #b3a89e

@buttonBackground = #f3ebdb
@componentBackground = #fdf8ec
@menuBackground = #fbf5e9

@selectionBackground = #ffd9e6
@selectionForeground = #6b4055
@selectionInactiveBackground = #f3e2ea
@selectionInactiveForeground = #7a5c68

@menuSelectionBackground = #ffd9e6
@menuHoverBackground = darken(@menuBackground,4%,derived)
@menuCheckBackground = darken(@menuSelectionBackground,6%,derived noAutoInverse)
@menuAcceleratorForeground = #a3988a
@menuAcceleratorSelectionForeground = #6b4055

@cellFocusColor = @accentColor
@icon = shade(@foreground,7%)

@accentColor = #d98aa8
@accentBaseColor = @accentColor
@accentBase2Color = @accentColor
@accentFocusColor               = if(@accentColor, @accentColor, spin(@accentBaseColor,-8))
@accentLinkColor                = if(@accentColor, @accentColor, saturate(spin(@accentBaseColor,-5),50%))
@accentSelectionBackground      = if(@accentColor, @accentColor, @accentBaseColor)
@accentSliderColor              = if(@accentColor, @accentColor, @accentBase2Color)
@accentUnderlineColor           = if(@accentColor, @accentColor, @accentBase2Color)
@accentButtonDefaultBackground  = if(@accentColor, @accentColor, spin(@accentBaseColor,-8))

@buttonArrowColor = shade(@foreground,17%)
@buttonDisabledArrowColor = tint(@buttonArrowColor,25%)
@buttonHoverArrowColor = darken(@buttonArrowColor,10%,derived noAutoInverse)
@buttonPressedArrowColor = darken(@buttonArrowColor,20%,derived noAutoInverse)

@dropCellBackground = darken(List.selectionBackground,6%,lazy)
@dropCellForeground = lazy(List.selectionForeground)
@dropLineColor = darken(List.selectionBackground,10%,lazy)
@dropLineShortColor = darken(List.selectionBackground,25%,lazy)


#---- system colors ----

activeCaption = @brightBackground
inactiveCaption = @background
controlHighlight = lighten($controlShadow,20%)
controlLtHighlight = lighten($controlShadow,25%)
controlDkShadow = darken($controlShadow,10%)


#---- Button ----

Button.background = @buttonBackground
Button.hoverBackground = darken($Button.background,3%,derived)
Button.pressedBackground = darken($Button.background,6%,derived)
Button.selectedBackground = #ffe0ec
Button.selectedForeground = #6b4055
Button.disabledSelectedBackground = darken($Button.background,3%,derived)

Button.borderColor = #ddd1bc
Button.disabledBorderColor = $Button.borderColor
Button.focusedBorderColor = #d98aa8
Button.hoverBorderColor = $Button.focusedBorderColor

Button.innerFocusWidth = 1

Button.default.background = #fadbe7
Button.default.foreground = #6b4055
Button.default.hoverBackground = #f5bfd4
Button.default.pressedBackground = #ffd9e6
Button.default.borderColor = #eeaac6
Button.default.hoverBorderColor = #d98aa8
Button.default.focusedBorderColor = #d98aa8
Button.default.focusColor = #d98aa8
Button.default.boldText = true

Button.toolbar.hoverBackground = darken($Button.background,2%,derived)
Button.toolbar.pressedBackground = darken($Button.background,4%,derived)
Button.toolbar.selectedBackground = #ffe0ec


#---- CheckBox ----

CheckBox.icon.focusWidth = 1
CheckBox.icon.borderColor = #cfc2aa
CheckBox.icon.background = #fdf8ec
CheckBox.icon.selectedBorderColor = #c97ba0
CheckBox.icon.selectedBackground = #f6c8da
CheckBox.icon.checkmarkColor = #7a4660
CheckBox.icon.disabledBorderColor = #ddd3c2
CheckBox.icon.disabledBackground = @disabledBackground
CheckBox.icon.disabledCheckmarkColor = #ccc2b8
CheckBox.icon.focusedBorderColor = #d98aa8
CheckBox.icon.focusedBackground = fade(#d98aa8,18%)
CheckBox.icon.hoverBorderColor = #d98aa8
CheckBox.icon.hoverBackground = darken($CheckBox.icon.background,2%,derived)
CheckBox.icon.pressedBorderColor = #d98aa8
CheckBox.icon.pressedBackground = darken($CheckBox.icon.background,4%,derived)
CheckBox.icon[filled].selectedBorderColor = #d98aa8
CheckBox.icon[filled].selectedBackground = #d98aa8
CheckBox.icon[filled].checkmarkColor = #fff8f0
CheckBox.icon[filled].hoverSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,3%,derived)
CheckBox.icon[filled].pressedSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,6%,derived)


#---- CheckBoxMenuItem ----

CheckBoxMenuItem.icon.checkmarkColor = @buttonArrowColor
CheckBoxMenuItem.icon.disabledCheckmarkColor = @buttonDisabledArrowColor


#---- Component ----

Component.borderColor = #ddd1bc
Component.disabledBorderColor = #e7ddcb
Component.focusedBorderColor = #d98aa8
Component.focusColor = #d98aa8
Component.linkColor = #c06a90
Component.accentColor = #d98aa8
Component.grayFilter = -12,-30,100

Component.error.borderColor = desaturate($Component.error.focusedBorderColor,25%)
Component.error.focusedBorderColor = #d95f6e
Component.warning.borderColor = darken(desaturate($Component.warning.focusedBorderColor,20%),10%)
Component.warning.focusedBorderColor = #d99a4e
Component.custom.borderColor = desaturate(#f00,50%,relative derived noAutoInverse)


#---- Desktop ----

Desktop.background = @brightBackground


#---- custom UIs (PC-98 dither) ----

PanelUI = com.github.deviceargent.pastel98.Pastel98PanelUI
DesktopPaneUI = com.github.deviceargent.pastel98.Pastel98DesktopPaneUI


#---- DesktopIcon ----

DesktopIcon.background = darken($Desktop.background,4%,derived)


#---- HelpButton ----

HelpButton.questionMarkColor = shade(@foreground,10%)
HelpButton.disabledQuestionMarkColor = tint(@background,30%)


#---- InternalFrame ----

InternalFrame.activeTitleBackground = #f1e7d3
InternalFrame.activeTitleForeground = #6b5a72
InternalFrame.inactiveTitleBackground = #eae0cd
InternalFrame.inactiveTitleForeground = #b3a89e
InternalFrame.activeBorderColor = #dccfb6
InternalFrame.inactiveBorderColor = #e7ddcb
InternalFrame.buttonHoverBackground = darken($InternalFrame.activeTitleBackground,6%,derived)
InternalFrame.buttonPressedBackground = darken($InternalFrame.activeTitleBackground,12%,derived)
InternalFrame.closeHoverBackground = lazy(Actions.Red)
InternalFrame.closePressedBackground = darken(Actions.Red,10%,lazy)
InternalFrame.closeHoverForeground = #fff
InternalFrame.closePressedForeground = #fff
InternalFrame.activeDropShadowOpacity = 0.35
InternalFrame.inactiveDropShadowOpacity = 0.5


#---- Menu ----

Menu.icon.arrowColor = @buttonArrowColor
Menu.icon.disabledArrowColor = @buttonDisabledArrowColor


#---- MenuBar ----

MenuBar.borderColor = $Separator.foreground


#---- PasswordField ----

PasswordField.capsLockIconColor = #00000040
PasswordField.revealIconColor = @foreground


#---- Popup ----

Popup.dropShadowColor = #6b5544
Popup.dropShadowOpacity = 0.16


#---- PopupMenu ----

PopupMenu.borderColor = #ddd1bc
PopupMenu.hoverScrollArrowBackground = darken(@background,4%)


#---- ProgressBar ----

ProgressBar.background = #eee3cf
ProgressBar.foreground = #e88ab0
ProgressBar.selectionBackground = #6b4055
ProgressBar.selectionForeground = #fff8f0


#---- RootPane ----

RootPane.activeBorderColor = darken(@background,14%,derived)
RootPane.inactiveBorderColor = darken(@background,9%,derived)


#---- ScrollBar ----

ScrollBar.track = #efe6d3
ScrollBar.thumb = #d9cdb5
ScrollBar.hoverTrackColor = #e9dfca
ScrollBar.hoverThumbColor = #edb7cb
ScrollBar.pressedThumbColor = #d98aa8
ScrollBar.hoverButtonBackground = darken(@background,4%,derived noAutoInverse)
ScrollBar.pressedButtonBackground = darken(@background,8%,derived noAutoInverse)


#---- Separator ----

Separator.foreground = #ddd1bc


#---- Slider ----

Slider.trackValueColor = #d98aa8
Slider.trackColor = #e6dbc6
Slider.thumbColor = #d98aa8
Slider.tickColor = @disabledForeground
Slider.focusedColor = fade(changeLightness(#d98aa8,60%,derived),40%,derived)
Slider.hoverThumbColor = darken($Slider.thumbColor,5%,derived)
Slider.pressedThumbColor = darken($Slider.thumbColor,8%,derived)
Slider.disabledTrackColor = darken(@background,6%)
Slider.disabledThumbColor = $Slider.disabledTrackColor


#---- SplitPane ----

SplitPaneDivider.draggingColor = #d98aa8


#---- TabbedPane ----

TabbedPane.underlineColor = #d98aa8
TabbedPane.inactiveUnderlineColor = #edb7cb
TabbedPane.disabledUnderlineColor = #ddd1bc
TabbedPane.hoverColor = darken($TabbedPane.background,4%,derived noAutoInverse)
TabbedPane.focusColor = @selectionBackground
TabbedPane.contentAreaColor = #ddd1bc
TabbedPane.buttonHoverBackground = darken($TabbedPane.background,4%,derived noAutoInverse)
TabbedPane.buttonPressedBackground = darken($TabbedPane.background,7%,derived noAutoInverse)
TabbedPane.closeBackground = null
TabbedPane.closeForeground = @disabledForeground
TabbedPane.closeHoverBackground = darken($TabbedPane.background,5%,derived)
TabbedPane.closeHoverForeground = @foreground
TabbedPane.closePressedBackground = darken($TabbedPane.background,9%,derived)
TabbedPane.closePressedForeground = $TabbedPane.closeHoverForeground


#---- Table ----

Table.gridColor = #ece1cc


#---- TableHeader ----

TableHeader.hoverBackground = darken($TableHeader.background,4%,derived)
TableHeader.pressedBackground = darken($TableHeader.background,8%,derived)
TableHeader.separatorColor = #ddd1bc
TableHeader.bottomSeparatorColor = $TableHeader.separatorColor


#---- ConfigSidebar (JD2 settings sidebar hover) ----

ConfigSidebar.hoverBackground = #c4a0a0


#---- TitlePane ----

TitlePane.background = #f1e7d3
TitlePane.inactiveBackground = #eae0cd
TitlePane.foreground = @foreground
TitlePane.inactiveForeground = @disabledForeground
TitlePane.embeddedForeground = @foreground
TitlePane.buttonBackground = #f3ebdb
TitlePane.buttonHoverBackground = #ffe0ec
TitlePane.buttonPressedBackground = #ffd9e6
TitlePane.closeHoverBackground = #d98aa8
TitlePane.closePressedBackground = #c06a90
TitlePane.closeHoverForeground = #ffffff
TitlePane.closePressedForeground = #ffffff


#---- ToggleButton ----

ToggleButton.selectedBackground = #ffe0ec
ToggleButton.disabledSelectedBackground = darken($ToggleButton.background,2%,derived)
ToggleButton.toolbar.selectedBackground = #ffe0ec


#---- ToolBar ----

ToolBar.hoverButtonGroupBackground = darken($ToolBar.background,3%,derived)


#---- ToolTip ----

ToolTip.border = 4,6,4,6
ToolTip.background = #fffaef


#---- Tree ----

Tree.hash = #ddd1bc


#---- Styles ------------------------------------------------------------------

[style]Button.inTextField = \
	focusable: false; \
	toolbar.margin: 1,1,1,1; \
	toolbar.spacingInsets: 1,1,1,1; \
	toolbar.hoverBackground: darken($TextField.background,4%); \
	toolbar.pressedBackground: darken($TextField.background,7%); \
	toolbar.selectedBackground: darken($TextField.background,10%)
