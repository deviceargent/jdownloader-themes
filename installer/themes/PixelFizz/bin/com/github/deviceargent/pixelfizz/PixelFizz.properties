#
# PixelFizz - 8-bit acid colors theme for JDownloader 2
# Standalone FlatLaf theme based on FlatLaf Dark
# Wine-violet night + chicle pink (primary) + calmed Phosphor green (secondary)
# Experimental: neon aura on controls via custom ButtonUI
#

#---- variables ----

@background = #26101f
@foreground = #f2dceb
@brightBackground = #1c0b17
@disabledBackground = #291223
@disabledForeground = #8a6480

@buttonBackground = #331630
@componentBackground = #36182e
@menuBackground = #2a1124

@selectionBackground = #ff7ac8
@selectionForeground = #24091c
@selectionInactiveBackground = #6e2450
@selectionInactiveForeground = #ffd7ee

@menuSelectionBackground = @greenCalmado
@menuHoverBackground = lighten(@menuBackground,4%,derived)
@menuCheckBackground = darken(@menuSelectionBackground,10%,derived noAutoInverse)
@menuAcceleratorForeground = #b89fc0
@menuAcceleratorSelectionForeground = #ffe3f4

@cellFocusColor = @accentColor
@icon = tint(@foreground,7%)

@accentColor = #ff7ac8
@greenCalmado = #3cc271

@buttonArrowColor = #ffb3dd
@buttonDisabledArrowColor = #7a5470
@buttonHoverArrowColor = lighten(@buttonArrowColor,10%,derived noAutoInverse)
@buttonPressedArrowColor = darken(@buttonArrowColor,10%,derived noAutoInverse)

@dropCellBackground = darken(List.selectionBackground,15%,lazy)
@dropCellForeground = lazy(List.selectionForeground)
@dropLineColor = darken(List.selectionBackground,20%,lazy)
@dropLineShortColor = darken(List.selectionBackground,35%,lazy)


#---- system colors ----

activeCaption = @componentBackground
inactiveCaption = @background
controlHighlight = lighten($controlShadow,15%)
controlLtHighlight = lighten($controlShadow,20%)
controlDkShadow = darken($controlShadow,12%)


#---- Button ----

Button.background = @buttonBackground
Button.hoverBackground = lighten($Button.background,4%,derived)
Button.pressedBackground = darken($Button.background,5%,derived)
Button.selectedBackground = #8a2f63
Button.selectedForeground = #ffd7ee
Button.disabledSelectedBackground = lighten($Button.background,2%,derived)

Button.borderColor = #55284a
Button.disabledBorderColor = #3a1a33
Button.focusedBorderColor = #ff7ac8
Button.hoverBorderColor = @greenCalmado

Button.innerFocusWidth = 1
Button.focusWidth = 2

Button.default.background = #6e2450
Button.default.foreground = #ffb3dd
Button.default.hoverBackground = #8a2f63
Button.default.pressedBackground = #5c1d42
Button.default.borderColor = #ff7ac8
Button.default.hoverBorderColor = #ff9fd6
Button.default.focusedBorderColor = #ff7ac8
Button.default.focusColor = #ff7ac8
Button.default.boldText = true

Button.toolbar.hoverBackground = lighten($Button.background,3%,derived)
Button.toolbar.pressedBackground = darken($Button.background,3%,derived)
Button.toolbar.selectedBackground = #8a2f63


#---- CheckBox ----

CheckBox.icon.focusWidth = 1
CheckBox.icon.borderColor = #55284a
CheckBox.icon.background = #36182e
CheckBox.icon.selectedBorderColor = #ff7ac8
CheckBox.icon.selectedBackground = #8a2f63
CheckBox.icon.checkmarkColor = #ff9fd6
CheckBox.icon.disabledBorderColor = #3a1a33
CheckBox.icon.disabledBackground = @disabledBackground
CheckBox.icon.disabledCheckmarkColor = #5c4055
CheckBox.icon.focusedBorderColor = #ff7ac8
CheckBox.icon.focusedBackground = fade(#ff7ac8,15%)
CheckBox.icon.hoverBorderColor = @greenCalmado
CheckBox.icon.hoverBackground = lighten($CheckBox.icon.background,3%,derived)
CheckBox.icon.pressedBorderColor = #ff9fd6
CheckBox.icon.pressedBackground = lighten($CheckBox.icon.background,5%,derived)
CheckBox.icon[filled].selectedBorderColor = #ff7ac8
CheckBox.icon[filled].selectedBackground = #ff7ac8
CheckBox.icon[filled].checkmarkColor = #24091c
CheckBox.icon[filled].hoverSelectedBackground = lighten($CheckBox.icon[filled].selectedBackground,4%,derived)
CheckBox.icon[filled].pressedSelectedBackground = darken($CheckBox.icon[filled].selectedBackground,6%,derived)


#---- CheckBoxMenuItem ----

CheckBoxMenuItem.icon.checkmarkColor = @buttonArrowColor
CheckBoxMenuItem.icon.disabledCheckmarkColor = @buttonDisabledArrowColor


#---- Component ----

Component.borderColor = #55284a
Component.disabledBorderColor = #3a1a33
Component.focusedBorderColor = #ff7ac8
Component.focusColor = #ff7ac8
Component.linkColor = #ff9fd6
Component.accentColor = #ff7ac8
Component.grayFilter = -20,-70,100

Component.error.borderColor = desaturate($Component.error.focusedBorderColor,25%)
Component.error.focusedBorderColor = #ff5c7a
Component.warning.borderColor = darken(desaturate($Component.warning.focusedBorderColor,20%),10%)
Component.warning.focusedBorderColor = #ffe600
Component.custom.borderColor = desaturate(#f00,50%,relative derived noAutoInverse)


#---- Desktop ----

Desktop.background = @brightBackground


#---- DesktopIcon ----

DesktopIcon.background = lighten($Desktop.background,12%,derived)


#---- HelpButton ----

HelpButton.questionMarkColor = shade(@foreground,10%)
HelpButton.disabledQuestionMarkColor = tint(@background,30%)


#---- InternalFrame ----

InternalFrame.activeTitleBackground = #36182e
InternalFrame.activeTitleForeground = #ff9fd6
InternalFrame.inactiveTitleBackground = #291223
InternalFrame.inactiveTitleForeground = #8a6480
InternalFrame.activeBorderColor = #6e2450
InternalFrame.inactiveBorderColor = #3a1a33
InternalFrame.buttonHoverBackground = lighten($InternalFrame.activeTitleBackground,8%,derived)
InternalFrame.buttonPressedBackground = lighten($InternalFrame.activeTitleBackground,14%,derived)
InternalFrame.closeHoverBackground = lazy(Actions.Red)
InternalFrame.closePressedBackground = darken(Actions.Red,10%,lazy)
InternalFrame.closeHoverForeground = #fff
InternalFrame.closePressedForeground = #fff
InternalFrame.activeDropShadowOpacity = 0.5
InternalFrame.inactiveDropShadowOpacity = 0.75


#---- Menu ----

Menu.foreground = @greenCalmado
Menu.selectionBackground = @greenCalmado
Menu.selectionForeground = #5c1d42
MenuItem.foreground = @greenCalmado
MenuItem.selectionBackground = @greenCalmado
MenuItem.selectionForeground = #5c1d42
Menu.icon.arrowColor = @buttonArrowColor
Menu.icon.disabledArrowColor = @buttonDisabledArrowColor


#---- MenuBar ----

MenuBar.foreground = @greenCalmado
MenuBar.hoverBackground = @greenCalmado
MenuBar.borderColor = $Separator.foreground


#---- PasswordField ----

PasswordField.capsLockIconColor = #ffe60080
PasswordField.revealIconColor = @foreground


#---- Popup ----

Popup.dropShadowColor = #000
Popup.dropShadowOpacity = 0.35


#---- PopupMenu ----

PopupMenu.borderColor = #55284a
PopupMenu.hoverScrollArrowBackground = lighten(@background,5%)


#---- ProgressBar ----

ProgressBar.background = #1c0b17
ProgressBar.foreground = @greenCalmado
ProgressBar.selectionBackground = #ffd7ee
ProgressBar.selectionForeground = #142e1a


#---- RootPane ----

RootPane.activeBorderColor = #6e2450
RootPane.inactiveBorderColor = #45203c


#---- ScrollBar ----

ScrollBar.track = #1c0b17
ScrollBar.thumb = #4a2340
ScrollBar.hoverTrackColor = #24101f
ScrollBar.hoverThumbColor = @greenCalmado
ScrollBar.pressedThumbColor = #ff7ac8
ScrollBar.hoverButtonBackground = lighten(@background,6%,derived noAutoInverse)
ScrollBar.pressedButtonBackground = lighten(@background,10%,derived noAutoInverse)


#---- Separator ----

Separator.foreground = #55284a


#---- Slider ----

Slider.trackValueColor = @greenCalmado
Slider.trackColor = #45203c
Slider.thumbColor = #ff7ac8
Slider.tickColor = @disabledForeground
Slider.focusedColor = fade(changeLightness(#ff7ac8,60%,derived),30%,derived)
Slider.hoverThumbColor = lighten($Slider.thumbColor,5%,derived)
Slider.pressedThumbColor = lighten($Slider.thumbColor,8%,derived)
Slider.disabledTrackColor = lighten(@background,6%)
Slider.disabledThumbColor = $Slider.disabledTrackColor


#---- SplitPane ----

SplitPaneDivider.draggingColor = @greenCalmado


#---- TabbedPane ----

TabbedPane.underlineColor = @greenCalmado
TabbedPane.inactiveUnderlineColor = @greenCalmado
TabbedPane.disabledUnderlineColor = #55284a
TabbedPane.hoverColor = lighten($TabbedPane.background,4%,derived noAutoInverse)
TabbedPane.focusColor = fade(#ff7ac8,30%)
TabbedPane.contentAreaColor = #55284a
TabbedPane.buttonHoverBackground = lighten($TabbedPane.background,5%,derived noAutoInverse)
TabbedPane.buttonPressedBackground = lighten($TabbedPane.background,8%,derived noAutoInverse)
TabbedPane.closeBackground = null
TabbedPane.closeForeground = @disabledForeground
TabbedPane.closeHoverBackground = @greenCalmado
TabbedPane.closeHoverForeground = #0a2a16
TabbedPane.closePressedBackground = darken($TabbedPane.closeHoverBackground,12%,derived)
TabbedPane.closePressedForeground = $TabbedPane.closeHoverForeground


#---- Table ----

Table.gridColor = #45203c


#---- TableHeader ----

TableHeader.hoverBackground = lighten($TableHeader.background,5%,derived)
TableHeader.pressedBackground = lighten($TableHeader.background,9%,derived)
TableHeader.separatorColor = #55284a
TableHeader.bottomSeparatorColor = $TableHeader.separatorColor


#---- TitlePane ----

TitlePane.background = #1c0b17
TitlePane.inactiveBackground = #20101b
TitlePane.foreground = @foreground
TitlePane.inactiveForeground = @disabledForeground
TitlePane.embeddedForeground = @foreground
TitlePane.buttonBackground = #26101f
TitlePane.buttonHoverBackground = @greenCalmado
TitlePane.buttonPressedBackground = darken($TitlePane.buttonHoverBackground,12%,derived)
TitlePane.closeHoverBackground = #ff5c7a
TitlePane.closePressedBackground = darken($TitlePane.closeHoverBackground,12%,derived)
TitlePane.closeHoverForeground = #ffffff
TitlePane.closePressedForeground = #ffffff


#---- ToggleButton ----

ToggleButton.selectedBackground = #8a2f63
ToggleButton.selectedForeground = #ffd7ee
ToggleButton.disabledSelectedBackground = lighten($ToggleButton.background,3%,derived)
ToggleButton.toolbar.selectedBackground = #8a2f63


#---- ToolBar ----

ToolBar.hoverButtonGroupBackground = lighten($ToolBar.background,4%,derived)


#---- ToolTip ----

ToolTip.border = 4,6,4,6
ToolTip.background = #36182e


#---- Tree ----

Tree.hash = #55284a


#---- custom UIs (neon aura experiment) ----

ButtonUI = com.github.deviceargent.pixelfizz.PixelFizzButtonUI


#---- Styles ------------------------------------------------------------------

[style]Button.inTextField = \
	focusable: false; \
	toolbar.margin: 1,1,1,1; \
	toolbar.spacingInsets: 1,1,1,1; \
	toolbar.hoverBackground: lighten($TextField.background,5%); \
	toolbar.pressedBackground: lighten($TextField.background,8%); \
	toolbar.selectedBackground: lighten($TextField.background,11%)
